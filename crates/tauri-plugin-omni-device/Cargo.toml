[package]
name = "tauri-plugin-omni-device"
version = "0.1.0"
authors = ["OMNI contributors"]
description = "Private native key custody and fixed-link bridge for OMNI"
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.77.2"
links = "tauri-plugin-omni-device"

[dependencies]
tauri = { version = "2.11.6" }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"
zeroize = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rand = "0.8"
fs2 = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }

[dev-dependencies]
tempfile = "3"
