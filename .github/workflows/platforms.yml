name: Build native platforms

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package*.json"
      - "scripts/build-platform.mjs"
      - "scripts/smoke-android.mjs"
      - ".github/workflows/platforms.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package*.json"
      - "scripts/build-platform.mjs"
      - "scripts/smoke-android.mjs"
      - ".github/workflows/platforms.yml"

permissions:
  contents: read

concurrency:
  group: native-platforms-${{ github.ref }}
  cancel-in-progress: false

# These are evaluation artifacts, not store releases. No signing credentials are
# read. Android uses a development debug key; iOS targets an unsigned simulator.
jobs:
  desktop:
    name: ${{ matrix.platform }} package and startup
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - platform: linux
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - platform: macos
            runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/apps/desktop/src-tauri/target
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: native-${{ matrix.platform }}
      - name: Install Linux build and display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev gnome-keyring patchelf xvfb dbus-x11
      - run: npm ci
      - name: Build and launch the embedded application
        if: runner.os != 'Linux'
        run: node scripts/build-platform.mjs ${{ matrix.platform }} --smoke
      - name: Build and launch under a virtual Linux display
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dbus-run-session -- bash -e <<'SCRIPT'
            printf '\n' | gnome-keyring-daemon --unlock --components=secrets
            xvfb-run -a node scripts/build-platform.mjs linux --smoke
          SCRIPT
      - name: Test the native runtime
        run: |
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --features custom-protocol --target ${{ matrix.target }}
          cargo test --manifest-path crates/tauri-plugin-omni-device/Cargo.toml --locked --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omni-${{ matrix.platform }}-${{ matrix.target }}-evaluation
          path: artifacts/platforms/${{ matrix.platform }}/
          if-no-files-found: warn
          retention-days: 14

  android:
    name: Android APK, emulator startup and Keystore tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/apps/desktop/src-tauri/target
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: native-android
      - name: Use the runner's Android SDK and accepted licenses
        shell: bash
        run: |
          test -n "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" < /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Generate the Android project and build both native ABIs
        run: node scripts/build-platform.mjs android
      - name: Install the AOSP emulator using the runner's accepted SDK license
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "emulator" "system-images;android-35;default;x86_64" < /dev/null
          printf 'no\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --name omni-ci --package "system-images;android-35;default;x86_64" --device pixel_5
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Exercise fresh native startup, reopening and Android Keystore
        shell: bash
        env:
          ANDROID_SERIAL: emulator-5554
          TAURI_ANDROID_PROJECT_PATH: ${{ github.workspace }}/apps/desktop/src-tauri/gen/android
        run: |
          mkdir -p artifacts/platforms/android
          "$ANDROID_HOME/emulator/emulator" -avd omni-ci -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on -memory 2048 -cores 2 > artifacts/platforms/android/emulator.log 2>&1 &
          omni_emulator_pid=$!
          cleanup() {
            "$ANDROID_HOME/platform-tools/adb" -s "$ANDROID_SERIAL" emu kill >/dev/null 2>&1 || true
            kill "$omni_emulator_pid" >/dev/null 2>&1 || true
            wait "$omni_emulator_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          shopt -s nullglob
          omni_apks=(artifacts/platforms/android/*.apk)
          test "${#omni_apks[@]}" -eq 1
          node scripts/smoke-android.mjs --serial "$ANDROID_SERIAL" --apk "${omni_apks[0]}" --output artifacts/platforms/android/android-smoke.json
          cd apps/desktop/src-tauri/gen/android
          ./gradlew --no-daemon :tauri-plugin-omni-device:connectedDebugAndroidTest
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          import json
          from pathlib import Path
          from xml.etree import ElementTree

          reports = Path("crates/tauri-plugin-omni-device/android/build/outputs/androidTest-results")
          expected = {
              "keySurvivesStoreRecreationAndOnlyCiphertextIsPersisted",
              "missingKeyForExistingVaultDoesNotCreateCredential",
              "corruptedEnvelopeIsNeverOverwritten",
              "authenticatedEnvelopeRejectsModifiedCiphertext",
              "missingWrappingKeyDoesNotReplaceSavedEnvelope",
          }
          cases = []
          for report in reports.rglob("*.xml"):
              cases.extend(case for case in ElementTree.parse(report).iter("testcase")
                           if case.get("classname") == "local.omni.device.VaultKeyStoreTest")
          passed = (len(cases) == 5 and {case.get("name") for case in cases} == expected
                    and all(not any(case.find(tag) is not None for tag in ("failure", "error", "skipped")) for case in cases))
          Path("artifacts/platforms/android/keystore-tests.json").write_text(
              json.dumps({"status": "passed" if passed else "failed", "expected_tests": 5,
                          "observed_tests": len(cases), "scope": "Android emulator Keystore instrumentation"}, indent=2) + "\n")
          if not passed:
              raise SystemExit("All five Android Keystore instrumented tests must run and pass.")
          PY
      - name: Collect Android Keystore test reports
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/platforms/android/keystore-tests
          if test -d crates/tauri-plugin-omni-device/android/build/outputs/androidTest-results; then
            cp -R crates/tauri-plugin-omni-device/android/build/outputs/androidTest-results/. artifacts/platforms/android/keystore-tests/
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omni-android-debug-arm64-x86_64
          path: artifacts/platforms/android/
          if-no-files-found: warn
          retention-days: 14

  ios-simulator:
    name: iOS unsigned arm64 ${{ matrix.flavor }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: simulator
            target: aarch64-apple-ios-sim
            arguments: --smoke
            output: ios
          - flavor: device
            target: aarch64-apple-ios
            arguments: --device
            output: ios-device
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/apps/desktop/src-tauri/target
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: native-ios-${{ matrix.flavor }}
      - name: Verify Xcode and simulator prerequisites
        shell: bash
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          command -v pod >/dev/null || brew install cocoapods
          command -v xcodegen >/dev/null || brew install xcodegen
      - run: npm ci
      - name: Archive without signing (launch only on the simulator)
        run: node scripts/build-platform.mjs ios ${{ matrix.arguments }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omni-ios-unsigned-arm64-${{ matrix.flavor }}
          path: artifacts/platforms/${{ matrix.output }}/
          if-no-files-found: warn
          retention-days: 14
