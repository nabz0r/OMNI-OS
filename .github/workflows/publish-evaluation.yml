name: Publish verified evaluation packages

on:
  push:
    branches: ["codex/publish-*"]
    paths: ["release-input/**"]

permissions:
  contents: read

concurrency:
  group: evaluation-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify the tested packages and publish their release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/publish-evaluation.py release-input
