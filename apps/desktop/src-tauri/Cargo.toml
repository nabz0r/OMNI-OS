[package]
name = "omni-desktop"
version = "0.5.0"
edition = "2021"
description = "OMNI local personal context interface"
license = "AGPL-3.0-only"

[lib]
name = "omni_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
omni-core = { path = "../../../crates/omni-core" }
tauri-plugin-omni-device = { path = "../../../crates/tauri-plugin-omni-device" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["sync"] }
subtle = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAlert", "NSButton", "NSWindow", "NSResponder", "NSView"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }

# Evaluation APKs retain debug signing and runtime checks without shipping
# hundreds of megabytes of Rust DWARF symbols in each architecture.
[profile.dev]
debug = 0
